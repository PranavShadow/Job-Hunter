filters:
  include_titles:

  # ============================================================
  # CORE SOFTWARE DEVELOPMENT — HIGHEST PRIORITY
  # ============================================================

  - '\bsoftware engineer\b'
  - '\bsoftware development engineer\b'
  - '\bsoftware developer\b'
  - '\bsde\b'
  - '\bswe\b'
  - '\bsoftware engineer\s*(i|1)\b'

  # Entry-level / graduate variants
  - '\bassociate software engineer\b'
  - '\bjunior software engineer\b'
  - '\bgraduate software engineer\b'
  - '\bgraduate software developer\b'
  - '\bgraduate engineer trainee\b'
  - '\bgraduate trainee\b'
  - '\bsoftware engineer\s*[-–]\s*(new grad|entry level|entry-level|graduate)\b'

  # Generic entry-level engineering titles
  - '\bassociate (software )?engineer\b'
  - '\bjunior (software )?developer\b'
  - '\btrainee software engineer\b'
  - '\btrainee software developer\b'
  - '\bsoftware engineering trainee\b'


  # ============================================================
  # FULL-STACK / WEB DEVELOPMENT — STRONG MATCH
  # ============================================================

  - '\bfull[\s-]?stack (developer|engineer)\b'
  - '\bfrontend (developer|engineer)\b'
  - '\bfront[\s-]?end (developer|engineer)\b'
  - '\bbackend (developer|engineer)\b'
  - '\bback[\s-]?end (developer|engineer)\b'
  - '\bweb developer\b'
  - '\bweb engineer\b'
  - '\bproduct engineer\b'


  # ============================================================
  # JAVASCRIPT / TYPESCRIPT / NODE / REACT
  # ============================================================

  - '\bjavascript (developer|engineer)\b'
  - '\btypescript (developer|engineer)\b'
  - '\breact(\.js)? (developer|engineer)\b'
  - '\bnode(\.js)? (developer|engineer)\b'
  - '\bnext(\.js)? (developer|engineer)\b'

  - '\bfull[\s-]?stack.*(javascript|typescript|react|node|next)\b'
  - '\bfrontend.*(javascript|typescript|react|next)\b'
  - '\bbackend.*(node|javascript|typescript)\b'


  # ============================================================
  # JAVA — STRONG MATCH
  # ============================================================

  - '\bjava (developer|engineer)\b'
  - '\bjava software engineer\b'
  - '\bjava backend (developer|engineer)\b'
  - '\bbackend.*java\b'


  # ============================================================
  # BACKEND / API DEVELOPMENT
  # ============================================================

  - '\bapi engineer\b'
  - '\bapi developer\b'
  - '\bbackend developer\b'
  - '\bbackend engineer\b'
  - '\bserver[-\s]?side (developer|engineer)\b'
  - '\bapplication developer\b'
  - '\bapplication engineer\b'


  # ============================================================
  # INTERNSHIPS
  # ============================================================

  - '\bsoftware engineer intern\b'
  - '\bsoftware engineering intern\b'
  - '\bsoftware developer intern\b'
  - '\bsoftware development intern\b'
  - '\bsoftware intern\b'
  - '\bsde intern\b'
  - '\bswe intern\b'
  - '\bweb developer intern\b'
  - '\bweb development intern\b'
  - '\bfull[\s-]?stack.*intern\b'
  - '\bbackend.*intern\b'
  - '\bfrontend.*intern\b'
  - '\bintern\b.*\b(software|developer|engineer|sde|swe)\b'
  - '\b(software|developer|engineer|sde|swe)\b.*\bintern\b'


  # ============================================================
  # CLOUD / DEVOPS — SECONDARY FIT
  # Your resume has AWS, Docker, CI/CD and deployment experience.
  # ============================================================

  - '\bdevops engineer\b'
  - '\bdevops developer\b'
  - '\bcloud engineer\b'
  - '\bcloud developer\b'
  - '\bcloud software engineer\b'
  - '\bplatform engineer\b'


  # ============================================================
  # AI / COMPUTER VISION — SELECTIVE FIT
  # BloodVision + Imagify support these, but they aren't your
  # primary profile.
  # ============================================================

  - '\bcomputer vision engineer\b'
  - '\bcomputer vision developer\b'
  - '\bai engineer\b'
  - '\bai software engineer\b'
  - '\bai developer\b'

  exclude_titles:
    - '\b(staff|principal|distinguished|fellow|architect)\b'
    - '\bsenior\b'
    - '\b(director|vp|vice president|head of|chief|cto)\b'
    - '\b(manager|management)\b'
    - '\b(sales|account executive|marketing|recruit|support|success)\b'

  locations:
    - gurgaon
    - gurugram
    - bangalore
    - bengaluru
    - delhi
    - noida
    - ghaziabad
    - lucknow
    - pune
    - hyderabad

  allow_remote: true

  max_age_days: 60

screen_batch_size: 8
screen_jd_chars: 1400
draft_jd_chars: 6000

score_threshold: 6.0
max_per_digest: 8

companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv